<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350">
  <defs>
    <style>
      .window { fill: #1C1C1E; rx: 10px; }
      .header { fill: #323233; }
      .btn-red { fill: #FF5F56; }
      .btn-yel { fill: #FFBD2E; }
      .btn-grn { fill: #27C93F; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #999; font-weight: 500; }
      .text { font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace; font-size: 14px; fill: #F5F5F5; }
      .prompt { fill: #F5F5F5; font-weight: 600; }
      .cmd { fill: #F5F5F5; }
      .out { fill: #A020F0; font-weight: bold; }
      .cursor { fill: #A3A3A6; animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Window Background with Shadow -->
  <rect class="window" x="20" y="20" width="760" height="310" filter="url(#shadow)" />
  
  <!-- Mac Window Header -->
  <path class="header" d="M20 30 C20 24.477 24.477 20 30 20 L770 20 C775.523 20 780 24.477 780 30 L780 48 L20 48 Z" />
  
  <!-- Mac Window Buttons -->
  <circle class="btn-red" cx="40" cy="34" r="6" />
  <circle class="btn-yel" cx="60" cy="34" r="6" />
  <circle class="btn-grn" cx="80" cy="34" r="6" />
  
  <!-- Header Title -->
  <text x="400" y="38" class="title" text-anchor="middle">📁 xenon — -zsh — 80x24</text>

  <!-- Terminal Content -->
  <g transform="translate(40, 85)">
    <!-- Command 1 -->
    <text y="0" class="text">
      <tspan class="prompt">xenon@MacBook-Pro ~ %</tspan> <tspan class="cmd">whoami</tspan>
    </text>
    <text y="25" class="text">
      <tspan class="out">Xenon</tspan> - A Full-Stack Web &amp; AI Developer with 5+ years of experience
    </text>
    
    <!-- Command 2 -->
    <text y="70" class="text">
      <tspan class="prompt">xenon@MacBook-Pro ~ %</tspan> <tspan class="cmd">cat tech_stack.json</tspan>
    </text>
    <text y="95" class="text">
      [ "Python", "Java", "React", "AWS", "Node.js", "PostgreSQL" ]
    </text>

    <!-- Command 3 -->
    <text y="140" class="text">
      <tspan class="prompt">xenon@MacBook-Pro ~ %</tspan> <tspan class="cmd">./mantra.sh</tspan>
    </text>
    <text y="165" class="text">
      "I am a man who loves programming"
    </text>
    
    <!-- Active Prompt & Blinking Cursor -->
    <text y="210" class="text">
      <tspan class="prompt">xenon@MacBook-Pro ~ %</tspan> <tspan class="cursor">█</tspan>
    </text>
  </g>
</svg>
